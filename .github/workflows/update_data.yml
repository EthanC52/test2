name: Refresh data and deploy Pages

"on":
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Two runs per hour, offset from :00 to reduce GitHub's peak scheduling delays.
    - cron: "7,37 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stablecoin-dashboard-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests on code changes and manual runs
        if: github.event_name != 'schedule'
        run: |
          python -m pytest -q
          python -m compileall -q scripts tests
          node --check assets/app.js

      - name: Migrate legacy histories once when detected
        shell: bash
        run: |
          set -euo pipefail
          legacy_found=false
          for path in \
            data/marketcap.json \
            data/sol_marketcap.json \
            data/xrpl_marketcap.json \
            data/stellar_marketcap.json \
            data/usdcv_eth_marketcap.json \
            data/usdcv_sol_marketcap.json; do
            if [[ -f "$path" ]]; then
              legacy_found=true
              break
            fi
          done
          if [[ "$legacy_found" == true ]]; then
            python scripts/migrate_legacy_data.py --clean
          fi

      - name: Remove local-only metadata
        run: rm -rf .claude

      - name: Refresh every available source
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
          ETHERSCAN_CONFIRMATIONS: "12"
        run: python scripts/fetch.py

      - name: Commit durable snapshots and Ethereum checkpoints
        id: commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clean checkout: stage the data refresh, checkpoint updates, and one-time
          # cleanup/migration deletions without maintaining a fragile path list.
          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No durable data change"
            exit 0
          fi

          git commit -m "data: refresh dashboard snapshots [skip ci]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Retry transient network failures. A non-fast-forward is surfaced clearly;
          # the Pages artifact is still built from this successful fetch below.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              pushed=true
              break
            fi
            echo "Push attempt ${attempt}/3 failed" >&2
            sleep $((attempt * 5))
          done
          if [[ "$pushed" != true ]]; then
            echo "::warning::Fresh data was generated and will be deployed, but the commit could not be pushed. The next run may need to replay a larger Ethereum range."
          fi

      - name: Build isolated Pages artifact
        run: python scripts/build_site.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
